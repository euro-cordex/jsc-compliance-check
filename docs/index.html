<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8" />
	<title>Compliance Report Dashboard</title>
	<link rel="stylesheet" href="style.css" />
	<meta name="viewport" content="width=device-width,initial-scale=1" />
</head>
<body>
	<header>
		<h1>Compliance Report Dashboard</h1>
		<div id="controls">
			<label>Institution:
				<select id="institutionFilter"><option value="">All</option></select>
			</label>
			<label>Source:
				<select id="sourceFilter"><option value="">All</option></select>
			</label>
			<label>Search filename:
				<input id="searchInput" type="text" placeholder="Type to filter..." />
			</label>
			<button id="clearFilters">Clear</button>
			<span id="status" aria-live="polite"></span>
		</div>
		<div id="legend">
			<strong>Legend:</strong>
			<span class="icon high" title="High priority present">✖</span> High priority &nbsp;
			<span class="icon none" title="No high priority">✔</span> No high priority<br>
			<span style="font-size:0.95em;color:#eee;">Note: Only the first file of each dataset is checked.</span>
		</div>
	</header>

	<main>
		<table id="reportTable">
			<thead>
				<tr>
					<th scope="col"><button type="button" class="sort-button" data-sort="flag">flag</button></th>
					<th scope="col"><button type="button" class="sort-button" data-sort="filename">filename</button></th>
					<th scope="col"><button type="button" class="sort-button" data-sort="variable_id">variable_id</button></th>
					<th scope="col"><button type="button" class="sort-button" data-sort="institution_id">institution_id</button></th>
					<th scope="col"><button type="button" class="sort-button" data-sort="source_id">source_id</button></th>
					<th scope="col"><button type="button" class="sort-button" data-sort="driving_source_id">driving_source_id</button></th>
					<th scope="col"><button type="button" class="sort-button" data-sort="driving_experiment_id">driving_experiment_id</button></th>
					<th scope="col"><button type="button" class="sort-button" data-sort="frequency">frequency</button></th>
					<th scope="col"><button type="button" class="sort-button" data-sort="file_modified">file_modified (UTC)</button></th>
					<th scope="col"><button type="button" class="sort-button" data-sort="cf_scored">cf_scored</button></th>
					<th scope="col"><button type="button" class="sort-button" data-sort="wcrp_scored">wcrp_scored</button></th>
					<th scope="col"><button type="button" class="sort-button" data-sort="cf_issues">cf_issues (h/m/l)</button></th>
					<th scope="col"><button type="button" class="sort-button" data-sort="wcrp_issues">wcrp_issues (h/m/l)</button></th>
				</tr>
			</thead>
			<tbody></tbody>
		</table>
	<!-- detailsPanel removed: details now shown inline below each row -->
	</main>

	<footer>
		<small>Data loaded from <code>report/compliance-report.csv</code>. Client-side parsing; large files may take a moment.</small>
		<small id="updateDate" style="display:block;margin-top:0.5em;color:#999;"></small>
	</footer>

	<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js" integrity="sha384-IQslZJjG6x7PplRt5Bz+9fYs+EDycBOJllvQAHcS4u+jNCz8s6/f2UAeQyn2BkL4" crossorigin="anonymous"></script>
	<script src="script.js"></script>
</body>
</html>
